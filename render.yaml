# Render Blueprint for the Galactic Rush V8 multiplayer server (render.com → New → Blueprint → this repository).
# Render serves it over HTTPS, so the game reaches it at wss://<service-name>.onrender.com.
# When asked, set ALLOWED_ORIGINS to your GitHub Pages origin, e.g. https://<you>.github.io (no path).
# TOKEN_SECRET is generated by Render and never leaves the server.
# Note: one instance only (lobbies live in memory); free instances sleep when idle and take about a minute to wake.
services:
  - type: web
    name: galactic-rush-mp
    runtime: node
    plan: free
    buildCommand: npm install --prefix server --omit=dev
    startCommand: node server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TOKEN_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
