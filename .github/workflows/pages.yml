# Galactic Rush V12: builds the game and publishes it to GitHub Pages on every push to main.
#   /       the V12 game (multiplayer and player accounts through the V12 server)
#   /v11/   the V11 game, exactly as published (dist/site-v11), with its own server address; it keeps its own saves
# The servers are separate services and are NOT deployed by this workflow (see README: Deployment). Before V12 is
# merged into main, set these repository variables (Settings -> Secrets and variables -> Actions -> Variables); they
# are public values, not secrets:
#   GR_MP_SERVER_V12        the V12 server's address, e.g. wss://galactic-rush-v12.onrender.com
#   GR_FIREBASE_API_KEY     the Firebase project's Web API key
#   GR_FIREBASE_PROJECT_ID  the Firebase project's id
# Or put them into config.js, as this repository does (the variables, when set, take precedence). Without either the
# build stops and the published site stays as it was.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Server dependencies (for the server and account tests)
        run: npm install --prefix server --omit=dev --no-audit --no-fund
      - name: Unit tests (game, career, courses, collisions)
        run: npm test
      - name: Multiplayer and account tests
        run: npm run test:mp && npm run test:accounts
      - name: Build the game
        env:
          GR_MP_SERVER: ${{ vars.GR_MP_SERVER_V12 }}
          GR_FIREBASE_API_KEY: ${{ vars.GR_FIREBASE_API_KEY }}
          GR_FIREBASE_PROJECT_ID: ${{ vars.GR_FIREBASE_PROJECT_ID }}
        run: node build.mjs --require-online
      - name: Keep the V11 game at /v11/
        run: mkdir -p dist/site/v11 && cp dist/site-v11/index.html dist/site-v11/config.js dist/site/v11/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
