<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Galactic Rush V7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Saira+Semi+Condensed:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas. HUD clings to the corners on translucent backplates; menus are left-aligned rails over the scene. One dark look by design. */
:root {
  --void: #05070b; --plate: rgba(7, 11, 19, 0.64); --plate-2: rgba(12, 18, 30, 0.82); --line: rgba(160, 210, 255, 0.2); --line-2: rgba(160, 210, 255, 0.42);
  --ink: #e8f1fa; --dim: #8a99ad; --signal: #ffb547; --cyan: #6fd8ff; --alert: #ff5248; --good: #73f7ae; --ion: #ff6cf2;
  --f-display: 'Michroma', 'Eurostile', 'Microgramma', 'Arial Black', sans-serif;
  --f-ui: 'Saira Semi Condensed', 'Arial Narrow', 'Roboto Condensed', 'Segoe UI', sans-serif;
  --f-num: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --hud: 1; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
body { font: 500 15px/1.4 var(--f-ui); -webkit-font-smoothing: antialiased; user-select: none; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--signal); outline-offset: 3px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; background: radial-gradient(120% 90% at 70% 30%, #0c1426 0%, var(--void) 60%); display: grid; place-items: center; z-index: 50; transition: opacity .6s; }
#loading.done { opacity: 0; pointer-events: none; }
.ld { width: min(560px, calc(100% - 48px)); display: grid; gap: 18px; }
.ld .logo-s { font: 400 clamp(22px, 5vw, 40px)/1 var(--f-display); letter-spacing: .14em; white-space: nowrap; }
.ld .bar { height: 2px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
.ld .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--cyan), var(--signal)); transition: width .25s; }
.ld .step { display: flex; justify-content: space-between; color: var(--dim); font: 500 12px var(--f-num); letter-spacing: .08em; text-transform: uppercase; }

/* ---------- menus ---------- */
#ui { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.screen { position: absolute; inset: 0; pointer-events: auto; display: flex; overflow-y: auto; box-sizing: border-box;
  padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); animation: scr-in .45s cubic-bezier(.2,.7,.2,1); }
@keyframes scr-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.screen.scrim { background: linear-gradient(90deg, rgba(5,7,11,.9) 0%, rgba(5,7,11,.55) 38%, rgba(5,7,11,0) 66%); }
.screen.scrim-r { background: linear-gradient(270deg, rgba(5,7,11,.0) 30%, rgba(5,7,11,.0) 60%), linear-gradient(90deg, rgba(5,7,11,.88) 0%, rgba(5,7,11,.45) 34%, rgba(5,7,11,0) 55%); }
.screen.full { background: rgba(5,7,11,.66); backdrop-filter: blur(4px); }
.screen.clear { background: linear-gradient(0deg, rgba(5,7,11,.85) 0%, rgba(5,7,11,0) 45%); }
.col { display: flex; flex-direction: column; gap: 20px; width: min(540px, 100%); margin-left: clamp(0px, 4vw, 64px); }
.center { margin: auto; width: min(900px, 100%); }
.logo { margin: 0; font: 400 72px/1 var(--f-display); letter-spacing: .06em; white-space: nowrap; text-transform: uppercase; }
.logo .a { display: block; color: var(--ink); }
.logo .b { display: block; color: var(--signal); margin-top: .12em; }
.kicker { font: 600 12px var(--f-num); letter-spacing: .34em; text-transform: uppercase; color: var(--cyan); }
.lede { color: var(--dim); max-width: 48ch; margin: 0; font-size: 15.5px; }
h2 { font: 400 clamp(26px, 4.2vw, 42px)/1.05 var(--f-display); letter-spacing: .06em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h3 { font: 600 12px var(--f-num); letter-spacing: .28em; text-transform: uppercase; color: var(--dim); margin: 0; }
.menu { display: flex; flex-direction: column; gap: 4px; }
.btn { position: relative; background: transparent; border: 0; border-left: 2px solid var(--line); padding: 10px 26px 10px 18px; cursor: pointer; text-align: left;
  font: 700 17px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); transition: background .15s, border-color .15s, padding .15s; min-width: 260px; }
.btn small { display: block; font: 500 13px var(--f-ui); letter-spacing: .04em; text-transform: none; color: var(--dim); margin-top: 1px; }
.btn:hover, .btn:focus-visible { background: linear-gradient(90deg, rgba(255,181,71,.16), rgba(255,181,71,0)); border-left-color: var(--signal); padding-left: 24px; outline: none; }
.btn.primary { background: linear-gradient(90deg, rgba(255,181,71,.95), rgba(255,181,71,.75)); color: #1a1104; border-left-color: #fff; clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
.btn.primary small { color: #5a3b0e; }
.btn.primary:hover, .btn.primary:focus-visible { background: #ffc66e; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.foot { margin-top: auto; color: var(--dim); font: 500 12px var(--f-num); letter-spacing: .06em; }
.chip { display: inline-block; padding: 3px 9px; font: 600 11px var(--f-num); letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--line-2); color: var(--cyan); }
.chip.amber { color: var(--signal); border-color: rgba(255,181,71,.5); }
.seg { display: inline-flex; border: 1px solid var(--line-2); }
.seg button { background: transparent; border: 0; padding: 7px 13px; cursor: pointer; font: 600 13px var(--f-ui); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--cyan); color: #031018; }
.panel { background: var(--plate); border: 1px solid var(--line); padding: 16px 18px; position: relative; }
.panel::before, .panel::after, .plate::before, .plate::after { content: ""; position: absolute; width: 9px; height: 9px; border: 1px solid var(--line-2); pointer-events: none; }
.panel::before, .plate::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.panel::after, .plate::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
.stats { display: grid; grid-template-columns: 96px 1fr 38px; gap: 9px 14px; align-items: center; font: 600 11.5px var(--f-num); letter-spacing: .16em; color: var(--dim); }
.stats i { display: block; height: 4px; background: rgba(255,255,255,.08); position: relative; }
.stats i b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--cyan), #c9f2ff); transition: width .4s cubic-bezier(.2,.8,.2,1); }
.stats em { font-style: normal; color: var(--ink); text-align: right; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 12px; }
.card { background: var(--plate); border: 1px solid var(--line); padding: 12px 12px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, transform .15s, background .15s; min-width: 0; }
.card:hover, .card:focus-visible { border-color: var(--cyan); transform: translateY(-2px); outline: none; }
.card[aria-pressed="true"] { border-color: var(--signal); background: rgba(255,181,71,.07); }
.card canvas { width: 100%; height: auto; aspect-ratio: 16 / 10; display: block; max-width: 100%; }
.card .t { font: 400 15px/1.2 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.card .d { color: var(--dim); font-size: 13px; }
.card .m { display: flex; justify-content: space-between; gap: 8px; font: 500 11.5px var(--f-num); letter-spacing: .06em; color: var(--dim); }
.card .m b { color: var(--ink); font-weight: 600; }
table.res { width: 100%; border-collapse: collapse; font-size: 14px; }
table.res th { text-align: left; font: 600 10.5px var(--f-num); letter-spacing: .2em; color: var(--dim); padding: 6px 10px; border-bottom: 1px solid var(--line); }
table.res td { padding: 9px 10px; border-bottom: 1px solid rgba(160,210,255,.07); font-variant-numeric: tabular-nums; }
table.res td.n { font-family: var(--f-num); }
table.res tr.me td { background: rgba(255,181,71,.12); color: #fff; }
table.res td.p { font: 400 18px var(--f-display); width: 34px; }
.tablewrap { overflow-x: auto; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 4px 26px; }
.keys div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(160,210,255,.08); padding: 6px 0; }
kbd { font: 600 11.5px var(--f-num); border: 1px solid var(--line-2); border-bottom-width: 2px; padding: 1px 6px; color: var(--ink); background: rgba(255,255,255,.04); white-space: nowrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer; font: 600 13px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--signal); }
.setting { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(160,210,255,.07); }
.setting > span { min-width: 0; }
input[type=range] { accent-color: var(--signal); width: 170px; }
textarea.save { width: 100%; min-height: 70px; background: rgba(0,0,0,.35); color: var(--ink); border: 1px solid var(--line); font: 12px var(--f-num); padding: 8px; box-sizing: border-box; resize: vertical; user-select: text; }
.shipnav { display: flex; align-items: center; gap: 12px; }
.arrow { background: var(--plate); border: 1px solid var(--line-2); width: 42px; height: 42px; cursor: pointer; font: 600 20px var(--f-ui); color: var(--ink); }
.arrow:hover, .arrow:focus-visible { border-color: var(--signal); outline: none; }
.skip { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); pointer-events: auto; font: 600 12px var(--f-num); letter-spacing: .14em; color: var(--dim); background: var(--plate); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; text-transform: uppercase; z-index: 25; }
.courseinfo { position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom)); z-index: 25; display: grid; gap: 4px; animation: scr-in .5s; }
.courseinfo b { font: 400 30px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-weight: 600; }
#hud .plate { position: absolute; background: var(--plate); border: 1px solid var(--line); backdrop-filter: blur(2px); }
.h-tl { top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); padding: 10px 12px; transform: scale(var(--hud)); transform-origin: top left; min-width: 196px; }
.pos { display: flex; align-items: baseline; gap: 6px; }
.pos b { font: 400 44px/1 var(--f-display); display: inline-block; }
.pos b.up { animation: posup .6s ease-out; } .pos b.down { animation: posdown .6s ease-out; }
@keyframes posup { 0% { color: var(--good); transform: translateY(6px); } 100% { color: var(--ink); transform: none; } }
@keyframes posdown { 0% { color: var(--alert); transform: translateY(-6px); } 100% { color: var(--ink); transform: none; } }
.pos span { font: 500 18px var(--f-num); color: var(--dim); }
.pos em { margin-left: auto; font: 600 10px var(--f-num); letter-spacing: .26em; color: var(--dim); font-style: normal; }
#hStand { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; font: 600 12px var(--f-ui); letter-spacing: .06em; }
#hStand li { display: flex; gap: 8px; padding: 2px 6px; transition: background .3s; }
#hStand li.me { background: rgba(255,181,71,.88); color: #1a1104; }
#hStand li b { width: 14px; font-family: var(--f-num); }
#hStand li em { margin-left: auto; font: 500 11.5px var(--f-num); color: var(--dim); font-style: normal; }
#hStand li.me em { color: #4f360c; }
.h-tc { top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) scale(var(--hud)); transform-origin: top center; padding: 6px 18px 8px; text-align: center; min-width: 190px; }
.lap { font: 600 10.5px var(--f-num); letter-spacing: .3em; color: var(--dim); }
.lap b { font: 400 24px var(--f-display); color: var(--ink); letter-spacing: .02em; margin-left: 8px; }
.time { font: 500 19px var(--f-num); }
.split { font: 600 14px var(--f-num); min-height: 19px; }
.split.good { color: var(--good); } .split.bad { color: var(--alert); }
.h-tr { top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); padding: 8px 12px; display: grid; gap: 3px; text-align: right; transform: scale(var(--hud)); transform-origin: top right; min-width: 170px; }
.h-tr div { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.h-tr span { font: 600 10px var(--f-num); letter-spacing: .26em; color: var(--dim); }
.h-tr b { font: 500 17px var(--f-num); }
.h-bl { left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); padding: 10px 14px 12px; transform: scale(var(--hud)); transform-origin: bottom left; width: 280px; }
.speed { display: flex; align-items: baseline; gap: 8px; }
.speed b { font: 400 52px/0.95 var(--f-display); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.speed span { font: 600 11px var(--f-num); letter-spacing: .26em; color: var(--dim); }
.meter { margin-top: 8px; display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center; font: 600 10px var(--f-num); letter-spacing: .22em; color: var(--dim); }
.meter i { display: block; height: 6px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
.meter i b { position: absolute; inset: 0 auto 0 0; background: var(--cyan); transition: width .12s linear; }
.meter i.boost b { background: linear-gradient(90deg, #2aa8e0, var(--cyan)); }
.meter i.boost.on { box-shadow: 0 0 10px var(--cyan); }
.meter i.hull b { background: var(--good); } .meter i.hull.low b { background: var(--alert); animation: blink .5s steps(2) infinite; }
.meter i.thr { height: 3px; } .meter i.thr b { background: var(--ink); opacity: .7; }
@keyframes blink { 50% { opacity: .35; } }
.kit { display: flex; gap: 16px; margin-top: 9px; font: 600 10.5px var(--f-num); letter-spacing: .18em; color: var(--dim); }
.kit b { color: var(--ion); font-size: 13px; } .kit .sh b { color: var(--cyan); }
#minimap { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 180px; height: 180px; transform: scale(var(--hud)); transform-origin: bottom right; }
#markers { position: absolute; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }
.mk { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); font: 600 11px var(--f-ui); letter-spacing: .08em; white-space: nowrap; text-align: center; color: var(--ink); text-shadow: 0 1px 3px #000; will-change: transform; }
.mk::after { content: ""; display: block; width: 6px; height: 6px; margin: 2px auto 0; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg); }
.mk em { display: block; font: 500 10.5px var(--f-num); font-style: normal; color: var(--dim); }
.mk.ghost { color: var(--cyan); }
#reticle { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; z-index: 9; color: var(--ion); }
#reticle svg { width: 100%; height: 100%; animation: spin 2.4s linear infinite; }
#reticle.locked svg { animation-duration: .7s; }
#reticle span { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font: 600 9.5px var(--f-num); letter-spacing: .2em; white-space: nowrap; margin-top: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
#warnBolt { position: absolute; top: 31%; left: 50%; transform: translateX(-50%); font: 600 12px var(--f-num); letter-spacing: .3em; color: var(--alert); padding: 4px 12px; border: 1px solid var(--alert); background: rgba(40,4,4,.55); animation: blink .35s steps(2) infinite; z-index: 9; }
#dmg { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 9; pointer-events: none; }
#dmg i { position: absolute; width: 140px; height: 26px; margin: -13px 0 0 -70px; border-top: 3px solid var(--alert); border-radius: 50% 50% 0 0 / 100% 100% 0 0; opacity: 0; transition: opacity .6s; filter: drop-shadow(0 0 6px var(--alert)); }
#banner { position: absolute; top: 22%; left: 0; right: 0; display: grid; justify-items: center; pointer-events: none; z-index: 11; }
.bn { font: 400 clamp(20px, 3.4vw, 34px) var(--f-display); letter-spacing: .2em; padding: 8px 30px; text-transform: uppercase; background: linear-gradient(90deg, transparent, var(--plate-2) 18%, var(--plate-2) 82%, transparent); animation: bn-in .7s cubic-bezier(.2,.9,.2,1); position: relative; overflow: hidden; }
.bn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-100%); animation: sweep 1.1s .2s ease-out; }
.bn.warn { color: var(--alert); } .bn.amber { color: var(--signal); } .bn.good { color: var(--good); }
.bn.ww { color: var(--alert); animation: bn-in .4s, blink .6s steps(2) .4s infinite; }
@keyframes bn-in { from { opacity: 0; letter-spacing: .6em; } to { opacity: 1; letter-spacing: .2em; } }
@keyframes sweep { to { transform: translateX(100%); } }
#msg { position: absolute; top: 33%; left: 0; right: 0; display: grid; gap: 5px; justify-items: center; pointer-events: none; z-index: 11; }
#msg div { font: 600 15px var(--f-ui); letter-spacing: .2em; text-transform: uppercase; padding: 3px 16px; background: var(--plate); border-left: 2px solid currentColor; animation: pop .25s ease-out; }
#msg div.warn { color: var(--alert); } #msg div.good { color: var(--good); } #msg div.amber { color: var(--signal); } #msg div.ion { color: var(--ion); }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
#count { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font: 400 120px/1 var(--f-display); color: var(--signal); pointer-events: none; z-index: 11; }
#count.go { color: var(--good); animation: pop .3s; }
#flash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,50,40,.4)); opacity: 0; transition: opacity .3s; z-index: 8; }
#fps { position: absolute; right: 8px; top: 8px; font: 500 11px var(--f-num); color: var(--good); background: rgba(0,0,0,.5); padding: 2px 6px; z-index: 40; }
#err { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--void); z-index: 60; }
.touchnote { color: var(--alert); font-size: 13px; }
@media (max-width: 760px) {
  .logo { font-size: 40px; } #hStand { display: none; } .h-tl { min-width: 0; } .speed b { font-size: 38px; } .h-bl { width: 210px; }
  #minimap { width: 120px; height: 120px; } .btn { min-width: 0; width: 100%; } .h-tr { min-width: 0; }
}
/* ---------- V7: career, garage, upgrades, paint shop, inventory, cosmetic shop ---------- */
.between { justify-content: space-between; }
.screen.still { animation: none; }
.wallet { display: inline-flex; border: 1px solid var(--line-2); font: 600 11px var(--f-num); letter-spacing: .14em; white-space: nowrap; }
.wallet span { padding: 4px 10px; display: inline-flex; gap: 6px; align-items: baseline; }
.wallet .cr { color: var(--signal); } .wallet .st { color: var(--ion); border-left: 1px solid var(--line-2); }
.wallet b { color: var(--ink); font-weight: 600; font-size: 14px; letter-spacing: .04em; }
b.cr, .rw-top b.cr, .rw-line b.cr { color: var(--signal); } b.st, .rw-line b.st { color: var(--ion); } b.good, .rw-line b.good { color: var(--good); }
.lede.small { font-size: 13px; max-width: 60ch; }
.reason { color: #ffb4a8; font-size: 13px; margin: 0; }
.btn.sm { min-width: 0; padding: 7px 14px 7px 12px; font-size: 13px; letter-spacing: .1em; border: 1px solid var(--line-2); border-left-width: 2px; }
.btn.sm:hover, .btn.sm:focus-visible { padding-left: 14px; }
.btn[disabled], .btn[disabled]:hover { opacity: .42; cursor: not-allowed; background: transparent; padding-left: 12px; }
.btn.primary[disabled] { background: rgba(255,181,71,.35); }
.btn.buy { border-color: rgba(255,181,71,.55); color: var(--signal); }
.btn.buy.armed { background: var(--signal); color: #1a1104; border-color: #fff; }
.btn.danger { color: var(--alert); border-left-color: var(--alert); }
.garage .gcol { width: min(560px, 100%); gap: 14px; }
.ghead { display: grid; gap: 12px; } .ghead h2 { font-size: clamp(24px, 3.4vw, 34px); }
