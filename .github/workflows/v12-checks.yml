# Galactic Rush V12: every push to the V12 review branch and every pull request runs the whole test suite, including
# the player-account tests against Firebase's own emulators (Authentication + Cloud Firestore, demo project: no
# credentials, nothing leaves the runner). This workflow deploys nothing.
name: V12 checks
on:
  push:
    branches: [v12-dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Server dependencies
        run: npm install --prefix server --omit=dev --no-audit --no-fund
      - name: Game, career, course and collision tests
        run: npm test
      - name: Multiplayer server tests
        run: npm run test:mp
      - name: Account tests (local stand-in for Google's services)
        run: npm run test:accounts
      - name: Account tests against the Firebase emulators
        run: npx --yes firebase-tools@13 emulators:exec --only auth,firestore --project demo-galactic-rush "node --test tests/account/emulator.test.mjs"
      - name: Build
        run: node build.mjs
